<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bol — Live Transcription</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span> Bol <small>live Hindi + English transcription</small></div>
</header>

<main>
  <section class="card recorder" aria-labelledby="rec-h">
    <div class="row between">
      <h2 id="rec-h">Live transcription</h2>
      <label class="engine">Engine
        <select id="engine"></select>
      </label>
    </div>

    <div class="controls">
      <button id="toggle" class="primary">● Start speaking</button>
      <span id="timer" class="mono">00:00</span>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <span id="status" class="status" role="status">Idle</span>
    </div>

    <div id="live" class="live" aria-live="polite" lang="hi">
      <span class="placeholder">Press start and speak — Hindi, English or a mix of both.</span>
    </div>

    <div class="row save">
      <input id="title" type="text" maxlength="200" placeholder="Title (optional — defaults to date & time)">
      <button id="save" disabled>Save to history</button>
      <button id="clear" class="ghost" disabled>Clear</button>
    </div>
    <p class="hint">Sessions are saved automatically when you stop. You can edit them below.</p>
  </section>

  <section class="card" aria-labelledby="hist-h">
    <div class="row between wrap">
      <h2 id="hist-h">Transcription history</h2>
      <div class="row">
        <input id="search" type="search" placeholder="Search title or text…">
        <button id="new">+ New</button>
      </div>
    </div>
    <div id="list" class="list"></div>
    <div class="pager row between">
      <button id="prev" class="ghost">← Newer</button>
      <span id="pageinfo" class="mono"></span>
      <button id="next" class="ghost">Older →</button>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlg-title">Transcription</h3>
    <label>Title <input id="f-title" required maxlength="200"></label>
    <label>Language <input id="f-lang" maxlength="40" placeholder="e.g. Hindi + English"></label>
    <label>Text <textarea id="f-content" rows="10" lang="hi"></textarea></label>
    <p class="meta" id="f-meta"></p>
    <div class="row end">
      <button value="cancel" class="ghost" type="button" id="f-cancel">Cancel</button>
      <button class="primary" type="submit" id="f-save">Save</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="alert"></div>
<script src="app.js"></script>
</body>
</html>
